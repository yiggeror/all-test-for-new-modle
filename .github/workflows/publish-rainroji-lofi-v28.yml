name: Publish Rainroji Lo-Fi V2.8 1080p Release

on:
  push:
    branches:
      - feat/lofi-seasons-v2
    paths:
      - .github/workflows/publish-rainroji-lofi-v28.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-v28:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Python dependencies
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -2
          python -m pip install -q --only-binary=:all: -r tools/gate3_v28/requirements.txt

      - name: Run deterministic Gate 3.8 reproduction and verification
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/gate3_v28 -v
          python tools/gate3_v28/reproduce.py
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path('dist/gate3_v28_qa/reproduction_qa.json').read_text(encoding='utf-8'))
          Path('dist/meta.env').write_text(
              f"FINAL_BYTES={qa['bytes']}\n"
              f"FINAL_SHA256={qa['sha256']}\n"
              f"FINAL_LUFS={qa['technical_qa']['lufs_i']}\n"
              f"FINAL_DBTP={qa['technical_qa']['dbtp']}\n",
              encoding='utf-8',
          )
          print('VERIFIED V2.8:', qa['bytes'], qa['sha256'], qa['technical_qa'])
          PY

      - name: Upload Rainroji_Lofi_V2.8_1080p.mp4 to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source dist/meta.env
          TAG="v2.8-rainroji-lofi-1080p"
          NOTES_FILE="dist/release_notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## Rainroji Lo-Fi 四季像素短片 v2.8（冬夜暖窗自然翻书重塑 × 秋景倚树少女 × 有机秋风 × 冬夜尾声 · 1080p）

          ### 本版核心升级（相对 v2.7）
          - **冬 · 雪夜家属院（值班室暖窗伏案翻书彻底重塑）**：
            - **贴桌低弧度自然翻书**：彻底消除旧版“水平直臂空悬 0.8 秒 + 半空悬空发光小白旗/斧头”的违和感；翻起的暖纸单页底部始终稳扎桌面书脊，手腕贴桌顺滑轻捻并沿低矮柔和弧线将书页从右向左翻过压平，精准对齐既有纸页轻拂拟音；
            - **头肩柔和协同微动**：将暖窗伏案人影头肩纳入动态合成，翻页时自然配合极克制的微低头跟视与回正，零边缘渗漏与闪烁；
            - **冬景窗外全层 100% 零回归**：完整保留“欢度春节”红横幅微褶、细枝风颤、路灯压降、电视微光、烟囱轻烟、全层落雪/窗雪/雪粉与空白墙面零假灯（暖窗 ROI 之外 0 像素变动）。
          - **春、夏、秋**：**100% 逐字节锁定沿用 v2.7**（春整冠风波 + 暖地常驻单猫 + 双侧落花 + 6 只归燕；夏逐帧暖琥珀车灯 + “网吧”4 次硬切同帧联动红水洼；秋 v2.7 修长优雅倚树看书少女 + 三段迎风长发 + 身前清晰翻书 + 有机多尺度 FBM 树冠风 + 静态路面独立地面积叶 + 88 条双侧飘叶）。
          - **音频与尾声（严格不加时，精确 3:17.23 / 5,917 帧）**：无损流拷贝沿用已签收 v2.4–v2.7 全部 **9,247 个 AAC-LC 包**（完整 Purrple Cat《Green Tea》+ 四季环境音 + 冬窗翻页拟音 + 尾声温润冬夜雪风 +8.0 dB 平滑渐强接棒与最后 2.7 秒同步淡出静音）。

          ### 成片规格
          - **文件名**：\`Rainroji_Lofi_V2.8_1080p.mp4\`
          - **文件大小**：${FINAL_BYTES} 字节
          - **SHA-256**：\`${FINAL_SHA256}\`
          - **画面**：\`1920×1080\`（\`320×180\` 原生像素画经 6× 最近邻无损整数放大）、30 fps、5,917 帧（3 分 17.23 秒）、H.264 High / CRF 14 / yuv420p / BT.709 / faststart
          - **音频**：48 kHz 立体声 256 kbps AAC-LC（9,247 包，无损沿用已签收音轨），综合响度 **${FINAL_LUFS} LUFS**，真峰值 **${FINAL_DBTP} dBTP**，零削波

          ### 音乐与致谢（CC BY 4.0）
          > Music: “Green Tea” by Purrple Cat, from *Bloom* (https://purrplecat.itch.io/bloom), licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Used in full with mild EQ/level adjustment, original procedural ambience/foley (with serene winter-night ambience outro swell), and synchronization to the four-season animation. Original ambience and page-turn foley by this project. Visual prototype acknowledgment: [Rainroji](https://github.com/yiggeror/Rainroji/tree/deliver/four-seasons-1080p).
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Rainroji_Lofi_V2.8_1080p.mp4 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Rainroji Lo-Fi Four Seasons v2.8 (1080p)" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$TAG" dist/Rainroji_Lofi_V2.8_1080p.mp4 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Rainroji Lo-Fi Four Seasons v2.8 (1080p)" --notes-file "$NOTES_FILE" --latest
          fi
