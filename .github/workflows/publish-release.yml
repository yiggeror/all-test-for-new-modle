name: Publish Monet High-Bitrate Releases

on:
  push:
    tags:
      - "v*-monet"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name"
        required: true
        default: "v2.0-monet"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout monet-living-canvas
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system packages and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg g++ fontconfig fonts-urw-base35 fonts-noto-cjk

      - name: Set up Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir numpy pillow

      - name: Reconstruct v1 1080p high-bitrate master from monet-short-film
        run: |
          mkdir -p dist
          git fetch origin monet-short-film:refs/remotes/origin/monet-short-film
          (
            git show origin/monet-short-film:output/monet_un_jour_a_giverny_1080p.mp4.part.00
            git show origin/monet-short-film:output/monet_un_jour_a_giverny_1080p.mp4.part.01
            git show origin/monet-short-film:output/monet_un_jour_a_giverny_1080p.mp4.part.02
            git show origin/monet-short-film:output/monet_un_jour_a_giverny_1080p.mp4.part.03
            git show origin/monet-short-film:output/monet_un_jour_a_giverny_1080p.mp4.part.04
          ) > "dist/莫奈第一版_吉维尼的一天_1080p.mp4"
          echo "3aa53824aac32e28fad3bc1e34a896fdf8fd6d351176278dbddb9e7ac211bbba  dist/莫奈第一版_吉维尼的一天_1080p.mp4" | sha256sum -c -

      - name: Build synchronized 96s audio track
        run: |
          python3 src/audio_mix.py assets/audio/master_96s.wav

      - name: Precompile native brush engine & render v2 1080p + 720p masters
        run: |
          python3 -c "import sys; sys.path.insert(0, 'src'); import engine"

          python3 src/render.py pipe 0 1440 1080 \
            | ffmpeg -y -v error -f rawvideo -pixel_format rgb24 -video_size 1920x1080 -framerate 30 -i - \
              -c:v libx264 -preset slow -crf 14 -g 60 -flags +cgop -pix_fmt yuv420p \
              -colorspace bt709 -color_primaries bt709 -color_trc bt709 /tmp/seg0.mkv &
          P1=$!

          python3 src/render.py pipe 1440 2880 1080 \
            | ffmpeg -y -v error -f rawvideo -pixel_format rgb24 -video_size 1920x1080 -framerate 30 -i - \
              -c:v libx264 -preset slow -crf 14 -g 60 -flags +cgop -pix_fmt yuv420p \
              -colorspace bt709 -color_primaries bt709 -color_trc bt709 /tmp/seg1.mkv &
          P2=$!

          wait $P1
          wait $P2

          printf "file '/tmp/seg0.mkv'\nfile '/tmp/seg1.mkv'\n" > /tmp/concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i /tmp/concat.txt -i assets/audio/master_96s.wav \
            -c:v copy -c:a aac -b:a 256k -movflags +faststart \
            "dist/莫奈第二版_光阴画境_1080p.mp4"

          ffmpeg -y -v error -i "dist/莫奈第二版_光阴画境_1080p.mp4" \
            -vf scale=1280:720:flags=lanczos \
            -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p \
            -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:a copy -movflags +faststart \
            "dist/莫奈第二版_光阴画境_720p.mp4"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release delete "${TAG}" -y || true
          gh release create "${TAG}" \
            --target monet-living-canvas \
            --title "莫奈纯代码短片合集（第一版 & 第二版 高清母版）" \
            --notes $'纯代码（NumPy + C++17 厚涂油画笔触引擎 + 同步配乐）生成的莫奈印象派一镜到底短片合集：\n\n- **莫奈第二版_光阴画境_1080p.mp4**：全新重制版《光阴画境》（96 秒 / 2880 帧 @ 30fps，1920×1080，CRF 14 高码率母版）\n- **莫奈第二版_光阴画境_720p.mp4**：新版《光阴画境》720p 高清版（1280×720）\n- **莫奈第一版_吉维尼的一天_1080p.mp4**：第一版《吉维尼的一天》1080p 高码率母版（92 秒 / 2760 帧，41.9 Mbps）'

          sleep 6

          upload_one() {
            local f="$1"
            local label="$2"
            for attempt in 1 2 3; do
              if gh release upload "${TAG}" "${f}#${label}" --clobber; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          mv "dist/莫奈第二版_光阴画境_1080p.mp4" "dist/monet_v2_1080p.mp4"
          mv "dist/莫奈第二版_光阴画境_720p.mp4" "dist/monet_v2_720p.mp4"
          mv "dist/莫奈第一版_吉维尼的一天_1080p.mp4" "dist/monet_v1_1080p.mp4"

          upload_one "dist/monet_v2_1080p.mp4" "莫奈第二版_光阴画境_1080p.mp4"
          upload_one "dist/monet_v2_720p.mp4" "莫奈第二版_光阴画境_720p.mp4"
          upload_one "dist/monet_v1_1080p.mp4" "莫奈第一版_吉维尼的一天_1080p.mp4"

          gh release view "${TAG}" --json assets --jq '.assets[] | [.name, .label, .size, .url] | @tsv'
          COUNT=$(gh release view "${TAG}" --json assets --jq '.assets | length')
          test "${COUNT}" -eq 3
